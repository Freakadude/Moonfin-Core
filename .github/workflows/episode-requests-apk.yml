# Builds the episode-requests version of the Android/Google TV app, named
# "Moonfin", and publishes it as a GitHub release. It has its own application
# id, so it installs next to the Play Store app instead of over it. Latest APK:
#   https://github.com/Freakadude/Moonfin-Core/releases/latest/download/Moonfin.apk
name: Episode requests APK

on:
  workflow_dispatch:
  push:
    branches: [feature/episode-requests]

permissions:
  contents: write
  issues: write

concurrency:
  group: episode-requests-apk
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.2'
  # A separate application id, so this installs next to the Play Store app
  # instead of over it. It also leaves Firebase push out (see build.gradle.kts).
  MOONFIN_TEST_ID_SUFFIX: '.episodes'
  MOONFIN_APP_NAME: 'Moonfin'

jobs:
  apk:
    runs-on: ubuntu-26.04
    # A build normally takes about 20 minutes. A hung one is stopped and reported.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The signing secrets are missing, so updates couldn't install over each other."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=../release.keystore
          storeType=$STORE_TYPE
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          keytool -list -keystore android/app/release.keystore -storetype "$STORE_TYPE" -storepass "$STORE_PASSWORD" >/dev/null

      - name: Limit Gradle memory
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
          kotlin.daemon.jvmargs=-Xmx2G
          EOF

      - name: Version
        id: meta
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d '[:space:]')
          BASE=$(printf '%s' "$VERSION_LINE" | cut -d'+' -f1)
          # Every run gets a higher version and build number, so Android takes
          # it as an update and the in-app checker sees it as newer. The tag
          # starts with v, so upstream's release workflow ignores it.
          echo "name=${BASE}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "number=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"
          echo "tag=v${BASE}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # The whole app, but only errors stop the build: upstream's own style
      # notes are left alone, while anything an upstream change broke in our
      # code shows up here before the slow build starts.
      - name: Analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build APK
        run: |
          flutter build apk --release \
            --flavor mobile \
            --build-name "${{ steps.meta.outputs.name }}" \
            --build-number "${{ steps.meta.outputs.number }}" \
            --dart-define=DISTRIBUTION_CHANNEL=apk \
            --dart-define=MOONFIN_UPDATE_REPO=${{ github.repository }}
          cp build/app/outputs/flutter-apk/app-mobile-release.apk Moonfin.apk
          ls -la Moonfin.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" Moonfin.apk \
            --target "$GITHUB_SHA" \
            --title "Moonfin ${{ steps.meta.outputs.name }} (episode requests)" \
            --notes "Personal build of Moonfin with single-episode requests to Sonarr. Has its own application id, so it installs next to the Play Store app. Latest APK: https://github.com/${{ github.repository }}/releases/latest/download/Moonfin.apk" \
            --latest

      # Moonfin Web is bundled into the Moonbase plugin, so the plugin is
      # rebuilt from this app code too. That needs the automation token, since
      # this workflow's own token can't start workflows in the plugin fork.
      - name: Rebuild the plugin's Moonfin Web
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::AUTOMATION_TOKEN isn't set, so the plugin wasn't rebuilt with this app code."
            exit 0
          fi
          gh workflow run "Episode requests release" -R Freakadude/Moonfin-Plugin --ref feature/episode-requests

      - name: Report a failed build
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create needs-attention --color D93F0B --description "Something needs a look" 2>/dev/null || true
          gh issue create --label needs-attention \
            --title "⚠ Action needed: the Moonfin app build failed ($(git rev-parse --short HEAD))" \
            --body "The episode-requests build of the Moonfin app failed, so no new APK was published and your TVs keep their current version.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Open the Moonfin Episode Downloader project in Claude and ask it to look at this failed build."
